<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Scriptura Sacra</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="logo.png">
</head>
<body>
    <!-- Pasek z wyborem: księga, rozdział, tłumaczenie, wpis manualny -->
    <div id="toolbar">
        <div class="selector">
            <select id="bookSelect"></select>
        </div>
        <div class="selector">
            <select id="chapterSelect"></select>
        </div>
        <div class="selector">
            <select id="translationSelect"></select>
        </div>
        <div class="selector">
            <input type="text" id="referenceInput" placeholder="np. Wj 1,2">
            <button id="refSubmit">Pokaż</button>
        </div>
    </div>
    <!-- Pole wyświetlania tekstu -->
    <div id="textDisplay"></div>

    <script src="script.js"></script>
</body>
</html>
